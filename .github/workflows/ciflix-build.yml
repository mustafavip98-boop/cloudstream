name: CifliX Android build

on:
  push:
    branches:
      - "ciflix/modern-redesign"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ciflix-android-build"
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout CifliX
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Install SDK packages directly; avoid malformed package-list parsing.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "platform-tools"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CifliX debug APK
        run: ./gradlew --no-daemon assembleStableDebug lint

      - name: Upload CifliX APK
        uses: actions/upload-artifact@v7
        with:
          name: CifliX-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
