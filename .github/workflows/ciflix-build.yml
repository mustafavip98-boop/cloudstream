name: CifliX Android build

on:
  push:
    branches:
      - "ciflix/modern-redesign"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ciflix-android-build"
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout CifliX
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Install SDK packages directly; avoid malformed package-list parsing.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; available cmdline-tools:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdk_status" -ne 0 ]; then
            echo "Android SDK license acceptance failed with exit code $sdk_status"
            exit "$sdk_status"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "platform-tools"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CifliX debug APK
        run: ./gradlew --no-daemon assembleStableDebug lint

      - name: Upload CifliX APK
        uses: actions/upload-artifact@v7
        with:
          name: CifliX-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
