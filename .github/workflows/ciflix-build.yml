name: CifliX Android build

on:
  push:
    branches:
      - "ciflix/modern-redesign"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ciflix-android-build"
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CifliX
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid setup-android's legacy "tools" package request (removed from SDK repositories).
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CifliX debug APK
        run: ./gradlew assembleStableDebug lint

      - name: Upload CifliX APK
        uses: actions/upload-artifact@v7
        with:
          name: CifliX-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
