name: CifliX Android build

on:
  push:
    branches:
      - "ciflix/modern-redesign"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ciflix-android-build"
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CifliX
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-35
            platform-tools

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CifliX debug APK
        run: ./gradlew assembleStableDebug lint

      - name: Upload CifliX APK
        uses: actions/upload-artifact@v7
        with:
          name: CifliX-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
